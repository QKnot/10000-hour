<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="url(#grad1)" />
  
  <!-- Clock face -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  
  <!-- Hour markers -->
  <line x1="16" y1="4" x2="16" y2="6" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="28" y1="16" x2="26" y2="16" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="16" y1="28" x2="16" y2="26" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="4" y1="16" x2="6" y2="16" stroke="white" stroke-width="2" opacity="0.8"/>
  
  <!-- Clock hands showing 10:00 -->
  <line x1="16" y1="16" x2="16" y2="8" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="20" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="white"/>
</svg>
